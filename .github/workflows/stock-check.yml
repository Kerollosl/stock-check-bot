name: Stock check

on:
  schedule:
    # UTC window spans the US trading day in both daylight and standard time.
    # The NYSE calendar skips closed sessions and early closes.
    - cron: "23 14-21 * * 1-5"
    # Friday after the close: 5:43 PM EDT / 4:43 PM EST.
    - cron: "43 21 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: Report to generate
        type: choice
        options: [scan, weekly]
        default: scan
      send:
        description: Deliver qualifying alerts (leave off for a preview)
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize failure report
        run: |
          mkdir -p reports/opportunities state
          printf '# Opportunity scanner needs attention\n\nThe run stopped before it could generate a report. Open the job logs for details.\n' > reports/opportunities/summary.md

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore research queue and sent-alert ledger
        uses: actions/cache/restore@v6.1.0
        with:
          path: state/opportunities.json
          key: opportunity-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            opportunity-state-v2-

      - name: Discover and evaluate opportunities
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SEND: ${{ inputs.send }}
        shell: bash
        run: |
          mode="${REQUESTED_MODE:-scan}"
          if [[ "${SCHEDULE}" == "43 21 * * 5" ]]; then
            mode=weekly
          fi
          args=(--mode "$mode" --state state/opportunities.json --output-dir reports/opportunities)
          if [[ "${EVENT_NAME}" == schedule ]]; then
            args+=(--scheduled --send)
          elif [[ "${REQUESTED_SEND}" == true ]]; then
            args+=(--send)
          fi
          python -m src.opportunity_monitor "${args[@]}"

      - name: Preserve queue even if delivery needs a retry
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: state/opportunities.json
          key: opportunity-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save email preview and research evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: opportunity-brief-${{ github.run_id }}
          path: reports/opportunities/
          retention-days: 30

      - name: Add readable summary
        if: always()
        run: cat reports/opportunities/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report service failure once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Opportunity scanner needs attention" in:title' --json number,title --jq '.[] | select(.title == "Opportunity scanner needs attention") | .number' | head -n1)
          if [[ -z "$issue" ]]; then
            printf 'The scanner or email delivery could not complete. Pending opportunity alerts have not been marked as delivered.\n\n[Open this run](%s/%s/actions/runs/%s) to see the error and email preview.\n\nThe issue closes after a successful delivery.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > reports/opportunities/failure.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opportunity scanner needs attention" --body-file reports/opportunities/failure.md --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Close resolved service alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A market-closed skip or preview cannot prove email delivery recovered.
          status=$(python -c "import json; print(json.load(open('reports/opportunities/delivery.json')).get('status', 'unknown'))")
          if [[ "$status" == accepted_by_mail_server || "$status" == delivered || "$status" == already_delivered ]]; then
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Opportunity scanner needs attention" in:title' --json number,title --jq '.[] | select(.title == "Opportunity scanner needs attention") | .number' | head -n1)
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
            fi
          fi
