# Stock Check Bot Configuration

watchlist:
- MSFT
- AMZN
- GOOG
- NFLX
- META
- NVDA

# Signal weights for the composite score (must sum to 1.0)
weights:
  technical:
    macd: 0.10
    golden_death_cross: 0.10
    rsi: 0.08
    bollinger: 0.07
    volume_trend: 0.05
  fundamental:
    earnings_surprise: 0.12
    pe_ratio: 0.08
    revenue_growth: 0.05
    earnings_growth: 0.05
  macro:
    fed_funds_rate: 0.08
    yield_curve: 0.07
    market_trend: 0.05
    vix: 0.05
    sector_rotation: 0.05

# Thresholds for buy/sell/hold decisions
thresholds:
  strong_buy: 0.7
  buy: 0.55
  hold_upper: 0.55
  hold_lower: 0.45
  sell: 0.45
  strong_sell: 0.3

# Backtesting configuration
backtest:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  initial_capital: 100000
  commission_pct: 0.001
  slippage_pct: 0.001

# Major dip detection
dip_detection:
  daily_drop_pct: -3.0
  weekly_drop_pct: -7.0
  from_high_pct: -15.0
  lookback_days: 252

# Background opportunity discovery. The original watchlist/dashboard still work.
# These are screening assumptions, not optimized return forecasts.
opportunity:
  universe_limit: 750
  min_market_cap: 5000000000
  min_average_volume: 300000
  min_average_daily_dollar_volume: 20000000
  max_deep_checks: 60
  workers: 3
  prefilter_drawdown_pct: 15
  min_drawdown_pct: 20
  min_operating_margin: 0.10
  min_revenue_growth: 0.0
  max_net_debt_to_ebitda: 3.0
  min_margin_of_safety_pct: 25
  max_stress_downside_pct: 35
  max_fundamental_age_days: 150
  fundamental_cache_hours: 24
  cache_refresh_move_pct: 4
  news_limit: 4
  news_max_age_days: 7
  alert_cooldown_hours: 48
  realert_further_drop_pct: 8
  github_fallback: true
